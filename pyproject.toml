[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xarness"
version = "0.1.0"
description = "Terminal chat client for OpenAI-compatible LLM APIs (UI/config layer of a CLI agent tool)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual-flowview @ git+https://github.com/tya5/textual-flowview.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # The suite is written to be process-isolated (tmp_path, patched
    # HOST_DIR/sockets, per-test state dirs), so xdist is the cheapest
    # speed-up available: ~5x on a 12-core box.
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
]

[project.scripts]
xarness = "xarness.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xarness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast by default; `pytest -n0 ...` is the serial/debug escape hatch.
addopts = "-n auto --dist load"
# A hung test should fail, not sit in a 30s wait or block a worker.
timeout = 180
markers = [
    "slow: real containers or end-to-end host/TUI flows; skip with -m 'not slow'",
]

