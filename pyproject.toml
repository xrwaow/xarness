[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xarness"
version = "0.1.0"
description = "Terminal chat client for OpenAI-compatible LLM APIs (UI/config layer of a CLI agent tool)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
xarness = "xarness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xarness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
