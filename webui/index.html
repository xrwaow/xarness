<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="xarness — chat with your coding agent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="xarness" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>xarness</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" id="favicon" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Paint the desktop column already collapsed when that was the last
      // choice; without this the open panel appears for a frame.
      try {
        if (matchMedia('(min-width: 768px)').matches && localStorage.getItem('xarness.sidebar') === 'closed')
          document.documentElement.dataset.sidebar = 'closed';
      } catch {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="main-head">
        <button
          id="menu-btn"
          class="icon-btn menu-btn"
          type="button"
          aria-label="Sessions and status"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 20 20"
            width="18"
            height="18"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          >
            <path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8.5" />
          </svg>
        </button>
        <div class="head-title">
          <span class="head-name" id="title">new chat</span>
          <span class="head-sub" id="subtitle"></span>
        </div>
      </header>
      <div class="body">
        <aside class="sidebar" id="sidebar" aria-label="Sessions and status" tabindex="-1">
          <div class="session-list" id="session-list" role="list"></div>
          <div class="sidebar-foot">
            <div class="info" id="info"></div>
            <div class="sidebar-actions">
              <button class="btn btn-ghost" id="tools-btn" type="button">/tools</button>
              <button class="btn btn-ghost" id="model-btn" type="button">/model</button>
              <button class="btn btn-ghost" id="theme-btn" type="button">theme</button>
              <button class="btn btn-ghost" id="help-btn" type="button">keys</button>
              <button class="btn btn-ghost" id="token-btn" type="button" hidden>token</button>
            </div>
          </div>
        </aside>
        <div class="scrim" id="scrim" aria-hidden="true"></div>
        <main class="main" id="main" data-view="home">
          <div class="logwrap">
            <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation" tabindex="0"></div>
            <div class="home" id="home" aria-label="Home"></div>
            <button class="jump" id="jump" type="button" hidden>↓ jump to latest</button>
          </div>
          <div class="composer" id="composer">
            <section class="askbar" id="askbar" hidden aria-label="Question from the agent"></section>
            <section class="steerbar" id="steerbar" hidden aria-label="Queued messages"></section>
            <div class="composer-panel">
              <div class="palette" id="palette" hidden>
                <div class="palette-list" id="palette-list" role="listbox" aria-label="Commands and files"></div>
                <div class="palette-foot" id="palette-foot" aria-hidden="true"></div>
              </div>
              <section class="diffbar" id="diffbar" hidden aria-label="Pending changes"></section>
              <div class="attachments" id="attachments" hidden></div>
              <div class="inputbar" id="inputbar">
                <label class="sr-only" for="input">Message</label>
                <textarea
                  class="input"
                  id="input"
                  rows="1"
                  enterkeyhint="send"
                  placeholder="Send a message…"
                  autocomplete="off"
                  autocapitalize="sentences"
                  spellcheck="true"
                ></textarea>
                <div class="input-actions">
                  <button class="btn btn-stop" id="stop" type="button" hidden aria-label="Stop" title="Stop the turn">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                      <rect x="4" y="4" width="12" height="12" rx="2.5" fill="currentColor" />
                    </svg>
                  </button>
                  <button
                    class="btn btn-send"
                    id="send"
                    type="button"
                    data-filled="false"
                    aria-label="Send message"
                    title="Send message"
                  >
                    <svg
                      viewBox="0 0 20 20"
                      width="18"
                      height="18"
                      aria-hidden="true"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M16 4v6.5a1 1 0 0 1-1 1H5" />
                      <path d="m9 6.5-4 4 4 4" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="composer-foot">
                <div class="foot-status" id="statusbar" aria-label="Model, mode, context and session tokens"></div>
              </div>
            </div>
          </div>
        </main>
        <aside class="diffview" id="diffview" aria-label="File diff" hidden></aside>
      </div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog class="sheet" id="sheet">
      <form method="dialog" class="sheet-form">
        <header class="sheet-head">
          <h2 class="sheet-title" id="sheet-title"></h2>
          <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">✕</button>
        </header>
        <p class="sheet-text" id="sheet-text" hidden></p>
        <div class="sheet-body" id="sheet-body"></div>
        <div class="sheet-buttons" id="sheet-buttons"></div>
      </form>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
